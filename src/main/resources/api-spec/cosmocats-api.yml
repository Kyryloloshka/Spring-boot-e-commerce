openapi: 3.0.0
info:
  title: Cosmo Cats Marketplace API
  version: 1.0.0

paths:
  /api/products:
    get:
      summary: Get all products
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductResponse"

    post:
      summary: Create product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          description: Validation error

  /api/products/{id}:
    get:
      summary: Get product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "404":
          description: Not found

    put:
      summary: Update product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "404":
          description: Not found
        "400":
          description: Validation error

    delete:
      summary: Delete product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /api/carts:
    get:
      summary: Get all shopping carts
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CartResponse"
        "403":
          description: Feature not available

    post:
      summary: Create new shopping cart
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartResponse"
        "403":
          description: Feature not available

  /api/carts/{id}:
    get:
      summary: Get shopping cart by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartResponse"
        "404":
          description: Cart not found
        "403":
          description: Feature not available

    delete:
      summary: Delete shopping cart
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "403":
          description: Feature not available

  /api/carts/{id}/clear:
    put:
      summary: Clear shopping cart
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Cart cleared
        "404":
          description: Cart not found
        "403":
          description: Feature not available

  /api/carts/{cartId}/items:
    post:
      summary: Add product to shopping cart
      parameters:
        - name: cartId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddToCartRequest"
      responses:
        "200":
          description: Product added to cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartResponse"
        "404":
          description: Cart not found
        "400":
          description: Validation error
        "403":
          description: Feature not available

  /api/carts/{cartId}/items/{productId}:
    delete:
      summary: Remove product from shopping cart
      parameters:
        - name: cartId
          in: path
          required: true
          schema:
            type: string
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product removed from cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartResponse"
        "403":
          description: Feature not available

components:
  schemas:
    ProductRequest:
      type: object
      required:
        - name
        - price
        - category
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
        description:
          type: string
          maxLength: 500
        price:
          type: number
          minimum: 0.01
        category:
          type: string

    ProductResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: number
        category:
          type: string

    CartResponse:
      type: object
      properties:
        id:
          type: string
        productIds:
          type: array
          items:
            type: string
        totalPrice:
          type: number
          minimum: 0
        itemCount:
          type: integer
          minimum: 0

    AddToCartRequest:
      type: object
      required:
        - productId
      properties:
        productId:
          type: string
